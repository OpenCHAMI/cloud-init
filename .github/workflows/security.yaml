name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    uses: OpenCHAMI/github-actions/.github/workflows/govulncheck.yml@464e059fbd56372b085ea7956712d41bd6df59d0 # v3.6
    with:
      go-package: ./...

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: OpenCHAMI/github-actions/.github/workflows/dependency-review.yml@464e059fbd56372b085ea7956712d41bd6df59d0 # v3.6
    with:
      fail-on-severity: high
      comment-summary-in-pr: never

  workflow-lint:
    name: workflow lint
    permissions:
      contents: read
      security-events: write
    uses: OpenCHAMI/github-actions/.github/workflows/lint-workflows.yml@464e059fbd56372b085ea7956712d41bd6df59d0 # v3.6

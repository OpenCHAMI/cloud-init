name: Release with goreleaser

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  go-version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.go-mod.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - id: go-mod
        run: echo "version=$(awk '/^go / {print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"

  stress-tests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Run release stress tests
        run: make test-stress

  release:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    needs:
      - go-version
      - stress-tests
    # Match the runtime image's libc. The shared workflow currently fixes
    # runs-on to ubuntu-latest, which can produce binaries Ubuntu 24.04 cannot run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ needs.go-version.outputs.version }}
      - uses: docker/setup-qemu-action@v4.1.0
      - uses: docker/setup-buildx-action@v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@v4.2.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc g++ make ca-certificates gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Set build metadata
        run: |
          {
            echo "CGO_ENABLED=1"
            echo "GIT_STATE=clean"
            echo "BUILD_HOST=$(hostname)"
            echo "GO_VERSION=$(go env GOVERSION)"
            echo "BUILD_USER=$(whoami)"
          } >> "$GITHUB_ENV"
      - name: Select release mode
        id: mode
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "flags=" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--snapshot" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and release
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v2.17.1
          args: release --clean ${{ steps.mode.outputs.flags }}
      - name: Attest binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: dist/cloud-init*.tar.gz
      - name: Select published image digests
        id: images
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          node .github/scripts/release-image-digests.cjs
      - name: Attest multi-architecture image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.multiarch }}
          push-to-registry: true
      - name: Attest amd64 image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.amd64 }}
          push-to-registry: true
      - name: Attest arm64 image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.arm64 }}
          push-to-registry: true

name: Release with goreleaser

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  stress-tests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run release stress tests
        run: make test-stress

  release:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    needs:
      - stress-tests
    # Match the runtime image's libc. The shared workflow currently fixes
    # runs-on to ubuntu-latest, which can produce binaries Ubuntu 24.04 cannot run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select release mode
        id: mode
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "flags=" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--snapshot" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and release
        id: goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v2.17.1
          args: release --clean ${{ steps.mode.outputs.flags }}
      - name: Attest binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/cloud-init*.tar.gz
      - name: Select published image digests
        id: images
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          node .github/scripts/release-image-digests.cjs
      - name: Attest multi-architecture image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.multiarch }}
          push-to-registry: true
      - name: Attest amd64 image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.amd64 }}
          push-to-registry: true
      - name: Attest arm64 image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/openchami/cloud-init
          subject-digest: ${{ steps.images.outputs.arm64 }}
          push-to-registry: true

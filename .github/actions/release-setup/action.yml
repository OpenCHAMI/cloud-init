name: Set up Linux release build
description: Use the same Go toolchain, cross-compilers and BuildKit for releases and PR snapshots.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false
    # Snapshot --load needs the containerd image store for provenance indexes.
    - name: Enable the containerd image store
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
    - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
    - name: Install cross-compilers
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends gcc g++ make ca-certificates gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - name: Set build metadata
      shell: bash
      run: |
        {
          echo "CGO_ENABLED=1"
          echo "GIT_STATE=$(if git diff-index --quiet HEAD --; then echo clean; else echo dirty; fi)"
          echo "BUILD_HOST=$(hostname)"
          echo "GO_VERSION=$(go env GOVERSION)"
          echo "BUILD_USER=$(whoami)"
        } >> "$GITHUB_ENV"

version: 2
project_name: cloud-init
before:
  hooks:
    - make swagger

builds:
  - &linux_build
    id: linux
    main: ./cmd/cloud-init-server
    binary: cloud-init-server
    # export GIT_STATE=$(if git diff-index --quiet HEAD --; then echo 'clean'; else echo 'dirty'; fi)
    # export BUILD_HOST=$(hostname)
    # export GO_VERSION=$(go version | awk '{print $3}')
    # export BUILD_USER=$(whoami)
    ldflags:
      - "-X 'main.GitCommit={{.Commit}}' \
         -X 'main.BuildTime={{.Timestamp}}' \
         -X 'main.Version={{.Version}}' \
         -X 'main.GitBranch={{.Branch}}' \
         -X 'main.GitTag={{.Tag}}' \
         -X 'main.GitState={{ .Env.GIT_STATE }}' \
         -X 'main.BuildHost={{ .Env.BUILD_HOST }}' \
         -X 'main.GoVersion={{ .Env.GO_VERSION }}' \
         -X 'main.BuildUser={{ .Env.BUILD_USER }}'"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    env:
      - CGO_ENABLED=1
      - CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}
      - CXX={{ if eq .Arch "arm64" }}aarch64-linux-gnu-g++{{ else }}g++{{ end }}


  # Keep the baseline archive, but select only the v3 build for container images.
  # Docker v2 in GoReleaser v2.17 does not filter artifacts by GOAMD64.
  - <<: *linux_build
    id: linux-baseline
    goarch:
      - amd64
    goamd64:
      - v1

dockers_v2:
  - &container_image
    id: multiarch
    ids:
      - linux
    images:
      - ghcr.io/openchami/{{ .ProjectName }}
    tags:
      - latest
      - "{{ .Tag }}"
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --pull=true
      - --provenance=mode=min
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files:
      - LICENSES/MIT.txt
      - CHANGELOG.md
      - README.md

  # Preserve the architecture-specific tags used by existing deployments.
  # Snapshots already add architecture suffixes to the multiarch entry's tags.
  - <<: *container_image
    id: amd64
    disable: "{{ .IsSnapshot }}"
    platforms:
      - linux/amd64
    tags:
      - "{{ .Tag }}-amd64"
      - "{{ .Major }}-amd64"
      - "{{ .Major }}.{{ .Minor }}-amd64"

  - <<: *container_image
    id: arm64
    disable: "{{ .IsSnapshot }}"
    platforms:
      - linux/arm64
    tags:
      - "{{ .Tag }}-arm64"
      - "{{ .Major }}-arm64"
      - "{{ .Major }}.{{ .Minor }}-arm64"

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}
    files:
      - LICENSES/MIT.txt
      - CHANGELOG.md
      - README.md


checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'


